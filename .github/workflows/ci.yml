name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify saved data and metrics
        run: python scripts/check_repository.py
      - name: Reproduce outputs and static demo
        run: |
          power-notice-radar run
          power-notice-radar evaluate
          python scripts/build_static_site.py
      - name: Verify regenerated outputs
        run: python scripts/check_repository.py
